version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: grandstay-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword@123
      MYSQL_DATABASE: hospitality_crm
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grandstay-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://root:RootPassword@123@mysql:3306/hospitality_crm?charset=utf8mb4
      - SECRET_KEY=grandstay_production_secret_key_2026_super_secure
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:80","http://localhost"]
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grandstay-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
